[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudrca-agent"
version = "0.1.0"
description = "Cross-layer cloud root cause analysis foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "charset-normalizer>=3.4,<4",
  "pydantic>=2.12,<3",
  "fastapi>=0.115,<1",
  "networkx>=3.4,<4",
  "polars>=1.30,<2",
  "python-multipart>=0.0.20,<1",
  "python-dateutil>=2.9,<3",
  "sentence-transformers>=3.0,<4",
  "pyyaml>=6.0,<7",
  "structlog>=25.4,<26",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.30,<1",
  "streamlit>=1.40,<2",
  "plotly>=5.24,<7",
]

[project.optional-dependencies]
dev = [
  "jupyter>=1.1,<2",
  "mypy>=1.18,<2",
  "nbformat>=5.10,<6",
  "pytest>=8,<10",
  "ruff>=0.13,<1",
  "types-python-dateutil>=2.9,<3",
  "types-networkx>=3.4,<4",
  "types-pyyaml>=6.0,<7",
]

[project.scripts]
cloudrca-profile = "cloudrca_dataset_validation.cli:main"
cloudrca-knowledge-refresh = "cloudrca_knowledge.cli:main"
cloudrca-api = "cloudrca_backend.api:main"

[tool.setuptools.packages.find]
where = ["src", "backend/src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests", "backend/tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["notebooks"]

[dependency-groups]
dev = [
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
]
